<title>Compensation Pattern Viewer</title>
<style>
  :root {
    --bg: #0c1016;
    --surface: #131a23;
    --surface-2: #1a222d;
    --border: #232c38;
    --text: #dde3ea;
    --text-dim: #8793a3;
    --accent: #3fb8ac;
    --accent-soft: rgba(63, 184, 172, 0.16);
    --ok: #4ade80;
    --ok-soft: rgba(74, 222, 128, 0.14);
    --warn: #f5b754;
    --warn-soft: rgba(245, 183, 84, 0.14);
    --bad: #f2777a;
    --bad-soft: rgba(242, 119, 122, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); border-color: #33404f; }
  .tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tab:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  }

  .panel {
    padding: 22px 22px 20px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--surface);
  }
  .panel h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .panel .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .panel p {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 16px;
    max-width: 65ch;
  }
  .panel code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--text);
  }

  .field { margin-bottom: 18px; }
  .field-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .field-label .value {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-size: 13px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
    cursor: pointer;
    margin-top: -7px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent); cursor: pointer;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  dl.legend {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
  }
  dl.legend dt { font-family: "IBM Plex Mono", monospace; color: var(--text); white-space: nowrap; }
  dl.legend dd { margin: 0; }

  .viewport { position: relative; background: #05070a; }
  .viewport canvas { display: block; width: 100%; height: 100%; }
  .viewport .hint {
    position: absolute; left: 16px; bottom: 14px;
    font-size: 11px; color: var(--text-dim);
    font-family: "IBM Plex Mono", monospace;
    background: rgba(12, 16, 22, 0.6);
    padding: 4px 9px; border-radius: 5px;
    pointer-events: none;
  }
  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
  }

  footer {
    padding: 7px 20px;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-family: "IBM Plex Mono", monospace;
  }
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<div class="app">
  <div class="topbar">
    <span class="brand">Compensation Pattern Viewer</span>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <main>
    <div class="panel" id="panel"></div>
    <div class="viewport" id="viewport">
      <div class="loading" id="loading">모델 로딩 중…</div>
      <canvas id="canvas"></canvas>
      <div class="hint" id="hint">드래그: 회전 · 휠/핀치: 줌</div>
    </div>
  </main>
  <footer>&quot;Victoria Rubin&quot; VRoid sample avatar — CC0 (no attribution required) · textures downscaled for this preview</footer>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

/* ---------- model data (base64 glTF-Binary) ---------- */
const MODEL_BASE64 = '__MODEL_BASE64__';

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

/* ---------- bone pose utilities (mirrors src/three/bonePose.js) ---------- */
const BONES = {
  pelvis: 'J_Bip_C_Hips',
  lumbar: 'J_Bip_C_Spine',
  thoracic: 'J_Bip_C_Chest',
  hipL: 'J_Bip_L_UpperLeg',
  kneeL: 'J_Bip_L_LowerLeg',
  ankleL: 'J_Bip_L_Foot',
  hipR: 'J_Bip_R_UpperLeg',
};

const deg = (d) => (d * Math.PI) / 180;

function findBoneNodes(root, names) {
  const map = {};
  const wanted = new Set(names);
  root.traverse((o) => { if (wanted.has(o.name)) map[o.name] = o; });
  return map;
}

function captureRestPose(nodes, boneNames) {
  const rest = {};
  for (const name of boneNames) {
    const bone = nodes[name];
    if (bone) rest[name] = bone.quaternion.clone();
  }
  return rest;
}

const _q = new THREE.Quaternion();
const _e = new THREE.Euler();

function applyBlendedPose(nodes, restPose, poseA, poseB, t) {
  const qa = new THREE.Quaternion();
  const qb = new THREE.Quaternion();
  for (const name in poseA) {
    const bone = nodes[name];
    const rest = restPose[name];
    if (!bone || !rest) continue;
    const a = poseA[name] || [0, 0, 0];
    const b = poseB[name] || [0, 0, 0];
    qa.setFromEuler(_e.set(a[0], a[1], a[2]));
    qb.setFromEuler(_e.set(b[0], b[1], b[2]));
    qa.slerp(qb, t);
    bone.quaternion.copy(rest).multiply(qa);
  }
}

/* ---------- shared scene chrome ---------- */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

function makeScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#05070a');
  const hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 1.1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 1.4);
  dir.position.set(3, 5, 2);
  dir.castShadow = true;
  scene.add(dir);
  const grid = new THREE.GridHelper(10, 20, 0x4b5163, 0x232c38);
  scene.add(grid);
  return scene;
}

function makeCamera() {
  return new THREE.PerspectiveCamera(45, 1, 0.1, 50);
}

/* ---------- demo definitions ---------- */
const demos = [];
let baseModel = null;
let active = null;
let currentControls = null;

function resize() {
  const vp = document.getElementById('viewport');
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h, false);
  if (active) { active.camera.aspect = w / h; active.camera.updateProjectionMatrix(); }
}
new ResizeObserver(resize).observe(document.getElementById('viewport'));

function buildModelInstance() {
  const inst = cloneSkeleton(baseModel);
  inst.rotation.y = Math.PI; // VRM avatars are authored facing -Z
  return inst;
}

function setActiveTab(id) {
  document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el.dataset.id === id));
  const demo = demos.find((d) => d.id === id);
  if (currentControls) currentControls.dispose();
  currentControls = new OrbitControls(demo.camera, canvas);
  currentControls.target.copy(demo.target);
  currentControls.enableDamping = true;
  currentControls.dampingFactor = 0.1;
  currentControls.minDistance = 0.6;
  currentControls.maxDistance = 10;
  currentControls.update();
  active = demo;
  document.getElementById('panel').innerHTML = demo.panelHTML;
  demo.onShow && demo.onShow();
  resize();
}

function initTabs() {
  const nav = document.getElementById('tabs');
  demos.forEach((d) => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.id = d.id;
    btn.textContent = d.label;
    btn.onclick = () => setActiveTab(d.id);
    nav.appendChild(btn);
  });
}

/* ---- Demo 1: viewer ---- */
function buildDemo1() {
  const scene = makeScene();
  scene.add(buildModelInstance());
  const camera = makeCamera();
  camera.position.set(0, 1.3, 3.4);
  return {
    id: 'viewer', label: '1. 기본 뷰어', scene, camera, target: new THREE.Vector3(0, 1, 0),
    panelHTML: `
      <p class="eyebrow">Demo 01</p>
      <h1>기본 뷰어</h1>
      <p>리깅된 인체 모델(&quot;Victoria Rubin&quot; VRoid 샘플, CC0)을 로드하고 OrbitControls로 회전/줌. 데스크톱은 드래그+휠, 모바일은 한 손가락 드래그 회전 · 두 손가락 핀치 줌/팬이 별도 구현 없이 기본 동작합니다.</p>
    `,
  };
}

/* ---- Demo 2: hip flexion / lumbar compensation ---- */
function buildDemo2() {
  const scene = makeScene();
  const model = buildModelInstance();
  scene.add(model);
  const nodes = findBoneNodes(model, Object.values(BONES));
  const poseBones = [BONES.pelvis, BONES.lumbar, BONES.thoracic, BONES.hipL, BONES.hipR];
  const rest = captureRestPose(nodes, poseBones);

  function normalPose(t) {
    const hip = -deg(90) * t;
    return {
      [BONES.hipL]: [hip, 0, 0], [BONES.hipR]: [hip, 0, 0],
      [BONES.lumbar]: [0, 0, 0], [BONES.thoracic]: [0, 0, 0], [BONES.pelvis]: [0, 0, 0],
    };
  }
  function compensatedPose(t) {
    const hip = -deg(45) * t, lumbar = -deg(35) * t, thoracic = -deg(12) * t, pelvisTilt = deg(18) * t;
    return {
      [BONES.hipL]: [hip, 0, 0], [BONES.hipR]: [hip, 0, 0],
      [BONES.lumbar]: [lumbar, 0, 0], [BONES.thoracic]: [thoracic, 0, 0], [BONES.pelvis]: [pelvisTilt, 0, 0],
    };
  }
  function applyAt(value) {
    const t = value / 100;
    applyBlendedPose(nodes, rest, normalPose(t), compensatedPose(t), t);
    const badge = document.getElementById('d2-badge');
    const readout = document.getElementById('d2-value');
    if (readout) readout.textContent = value;
    if (badge) {
      let label = '정상 패턴', cls = 'ok';
      if (t > 0.66) { label = '뚜렷한 요추 보상'; cls = 'bad'; }
      else if (t > 0.33) { label = '경도 요추 보상 시작'; cls = 'warn'; }
      badge.textContent = label;
      badge.className = 'badge ' + cls;
    }
  }

  const camera = makeCamera();
  camera.position.set(0, 1.3, 3.4);
  return {
    id: 'hip-lumbar', label: '2. 고관절-요추 보상', scene, camera, target: new THREE.Vector3(0, 1, 0),
    panelHTML: `
      <p class="eyebrow">Demo 02 · Core</p>
      <h1>고관절 굴곡 – 요추 보상 패턴</h1>
      <p>슬라이더 하나가 고관절 굴곡 진행도와 정상↔보상 포즈의 블렌드 가중치를 동시에 제어합니다. 각 본의 목표 회전을 오일러 → 쿼터니언으로 변환해 <code>Quaternion.slerp</code>로 두 포즈를 보간하고, bind pose 기준 델타로 적용합니다.</p>
      <div class="field">
        <div class="field-label"><span>고관절 굴곡 각도</span><span class="value" id="d2-value">40</span></div>
        <input type="range" id="d2-slider" min="0" max="100" value="40">
      </div>
      <div class="badge ok" id="d2-badge">경도 요추 보상 시작</div>
      <dl class="legend">
        <dt>고관절(양측)</dt><dd>정상 최대 -90° → 보상 시 -45°만 기여</dd>
        <dt>요추</dt><dd>정상 0° 유지 → 보상 시 최대 -35° 굴곡</dd>
        <dt>골반</dt><dd>정상 0° → 보상 시 최대 18° 후방경사</dd>
      </dl>
    `,
    onShow() {
      applyAt(40);
      document.getElementById('d2-slider').oninput = (e) => applyAt(Number(e.target.value));
    },
  };
}

/* ---- Demo 3: static posture ---- */
function buildDemo3() {
  const scene = makeScene();
  const model = buildModelInstance();
  scene.add(model);
  const nodes = findBoneNodes(model, [BONES.pelvis, BONES.lumbar, BONES.thoracic]);
  const rest = captureRestPose(nodes, [BONES.pelvis, BONES.lumbar, BONES.thoracic]);

  const NEUTRAL = { [BONES.pelvis]: [0, 0, 0], [BONES.lumbar]: [deg(6), 0, 0], [BONES.thoracic]: [0, 0, 0] };
  const LIST = { [BONES.pelvis]: [0, 0, 0], [BONES.lumbar]: [deg(-4), 0, deg(28)], [BONES.thoracic]: [0, 0, deg(20)] };

  let showPosture = true;
  let blend = 1;
  let raf = null;

  function loop() {
    const goal = showPosture ? 1 : 0;
    blend += (goal - blend) * 0.12;
    applyBlendedPose(nodes, rest, NEUTRAL, LIST, blend);
    raf = requestAnimationFrame(loop);
  }

  const camera = makeCamera();
  camera.position.set(0, 1.3, 3.4);
  return {
    id: 'posture', label: '3. 정적 자세', scene, camera, target: new THREE.Vector3(0, 1, 0),
    panelHTML: `
      <p class="eyebrow">Demo 03</p>
      <h1>정적 자세 하이라이트</h1>
      <p>&quot;좌측 체간 측방 편위(list) + 요추 전만 감소&quot; 자세를 고정 포즈로 세팅하고, 정상 자세와 토글 비교합니다. 전환 시 스프링 형태로 부드럽게 보간됩니다.</p>
      <button class="btn" id="d3-toggle">정상 자세로 전환</button>
      <div class="badge bad" id="d3-badge">좌측 체간 측방 편위 + 요추 전만 감소</div>
    `,
    onShow() {
      cancelAnimationFrame(raf);
      const btn = document.getElementById('d3-toggle');
      const badge = document.getElementById('d3-badge');
      function render() {
        btn.textContent = showPosture ? '정상 자세로 전환' : '보상 자세(list)로 전환';
        badge.textContent = showPosture ? '좌측 체간 측방 편위 + 요추 전만 감소' : '정상 자세';
        badge.className = 'badge ' + (showPosture ? 'bad' : 'ok');
      }
      btn.onclick = () => { showPosture = !showPosture; render(); };
      render();
      loop();
    },
  };
}

/* ---- Demo 4: dermatome highlight ---- */
function buildDemo4() {
  const scene = makeScene();
  const model = buildModelInstance();
  scene.add(model);
  const nodes = findBoneNodes(model, [BONES.kneeL, BONES.ankleL]);

  const material = new THREE.MeshBasicMaterial({ color: '#ff5a36', transparent: true, opacity: 0.55 });
  const shinGeo = new THREE.CapsuleGeometry(0.035, 0.2, 4, 8);
  const shinMesh = new THREE.Mesh(shinGeo, material);
  shinMesh.position.set(0.05, -0.2, 0);
  nodes[BONES.kneeL].add(shinMesh);

  const footGeo = new THREE.BoxGeometry(0.05, 0.02, 0.12);
  const footMesh = new THREE.Mesh(footGeo, material.clone());
  footMesh.position.set(0.02, -0.02, -0.055);
  nodes[BONES.ankleL].add(footMesh);

  const camera = makeCamera();
  camera.position.set(0.55, 0.55, 1.3);
  return {
    id: 'dermatome', label: '4. 부위 하이라이트', scene, camera, target: new THREE.Vector3(0.1, 0.35, 0),
    panelHTML: `
      <p class="eyebrow">Demo 04</p>
      <h1>신체 부위 하이라이트 (L5)</h1>
      <p>좌측 종아리 외측 ~ 발등 영역을 반투명 데칼 메시로 표시합니다. <code>bone.add(mesh)</code>로 기존 스켈레톤 본에 직접 자식으로 붙어있어, 포즈가 바뀌어도 함께 따라 움직입니다.</p>
      <button class="btn" id="d4-toggle">하이라이트 끄기</button>
      <div class="badge warn">데칼 메시 vs 텍스처 오버레이 비교는 리포트 참고</div>
    `,
    onShow() {
      const btn = document.getElementById('d4-toggle');
      let visible = true;
      btn.onclick = () => {
        visible = !visible;
        shinMesh.visible = visible;
        footMesh.visible = visible;
        btn.textContent = visible ? '하이라이트 끄기' : '하이라이트 켜기';
      };
    },
  };
}

/* ---------- boot ---------- */
const loader = new GLTFLoader();
loader.parse(base64ToArrayBuffer(MODEL_BASE64), '', (gltf) => {
  baseModel = gltf.scene;
  demos.push(buildDemo1(), buildDemo2(), buildDemo3(), buildDemo4());
  initTabs();
  document.getElementById('loading').style.display = 'none';
  setActiveTab(demos[0].id);

  function tick() {
    if (currentControls) currentControls.update();
    if (active) renderer.render(active.scene, active.camera);
    requestAnimationFrame(tick);
  }
  tick();
}, (err) => {
  document.getElementById('loading').textContent = '모델 로드 실패: ' + err.message;
});
</script>
